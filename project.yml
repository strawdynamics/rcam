name: RCam
options:
  bundleIdPrefix: com.strawdynamics
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: TK7EDP5B95
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    ARCHS: arm64

settingGroups:
  ffmpeg:
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/RCamKit/CFFmpeg
    HEADER_SEARCH_PATHS: $(SRCROOT)/vendor/ffmpeg/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/vendor/ffmpeg/lib
    # Resolves through the lib<name>.dylib symlinks in vendor/ffmpeg/lib, which
    # point at the soname-named real files. The linker records each library's
    # install name (@rpath/lib<name>.<major>.dylib), so every target that links
    # FFmpeg also needs an LD_RUNPATH_SEARCH_PATHS entry saying where to find
    # them at runtime -- the app in its bundle, rcamcli in the vendor dir.
    OTHER_LDFLAGS: "-lavformat -lavcodec -lavutil"

configFiles:
  Debug: Configs/Version.xcconfig
  Release: Configs/Version.xcconfig

targets:
  RCam:
    type: application
    platform: macOS
    sources:
      # The license is called out explicitly rather than left to the RCam glob:
      # its extension matches no known type, so the build phase XcodeGen infers
      # for it is not something to rely on. LGPL-2.1 §6 requires a copy of the
      # license to accompany the binary, so it has to land in Resources.
      - path: RCam
        excludes: ["Resources/COPYING.LGPLv2.1"]
      - path: RCam/Resources/COPYING.LGPLv2.1
        buildPhase: resources
      - path: RCamKit
        excludes: ["CFFmpeg/**"]
      # FFmpeg ships inside the bundle as replaceable dylibs rather than linked
      # into the executable. That is what LGPL-2.1 §6(b) asks for -- see
      # scripts/build-ffmpeg.sh and RCam/Acknowledgements.swift -- and it is why
      # these are named here one by one: the soname is part of the file name, so
      # an FFmpeg upgrade that bumps a major version has to be noticed here
      # rather than at launch on a tester's Mac. scripts/build.sh asserts that
      # this list matches what is actually in vendor/ffmpeg/lib.
      - path: vendor/ffmpeg/lib/libavformat.61.dylib
        buildPhase:
          copyFiles:
            destination: frameworks
        attributes: [CodeSignOnCopy]
      - path: vendor/ffmpeg/lib/libavcodec.61.dylib
        buildPhase:
          copyFiles:
            destination: frameworks
        attributes: [CodeSignOnCopy]
      - path: vendor/ffmpeg/lib/libavutil.59.dylib
        buildPhase:
          copyFiles:
            destination: frameworks
        attributes: [CodeSignOnCopy]
    settings:
      groups: [ffmpeg]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strawdynamics.rcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    entitlements:
      path: RCam/RCam.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.system-extension.install: true
        # Sandboxed access to CMIO devices (needed to write the sink stream).
        com.apple.security.device.camera: true
    info:
      path: RCam/Info.plist
      properties:
        LSUIElement: true
        NSCameraUsageDescription: RCam pushes video into its own virtual camera device.
        # macOS 15 gates outbound LAN connections behind Local Network privacy.
        # Without this string the RTSP connect to a camera on the local subnet
        # fails as EHOSTUNREACH ("No route to host") with no permission prompt
        # and no hint that TCC is the cause -- see loops/20260822-A-RENAME.md.
        NSLocalNetworkUsageDescription: RCam connects to RTSP cameras on your local network.
        CFBundleDisplayName: RCam
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # App Store Connect requires a category; the archive warns without one.
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: Copyright (c) 2026 Straw Dynamics. All rights reserved.
        # RCam ships no cryptography of its own: RTSP runs in the clear, and the
        # only crypto it touches is the OS Keychain. Both are exempt, so this
        # declaration skips the export-compliance prompt on every TestFlight
        # build. Re-check if RTSPS/TLS is ever added.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: RCamExtension
        embed: true
        codeSign: true

  RCamExtension:
    type: system-extension
    platform: macOS
    sources: [RCamExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strawdynamics.rcam.extension
        PRODUCT_NAME: com.strawdynamics.rcam.extension
        # Deliberately NOT the app's epoch stamp. This version only changes when
        # the extension's own inputs change (see scripts/build.sh); re-activating
        # at an unchanged version is a no-op, which is what keeps the running
        # extension -- and the "RCam" device -- alive across a build.
        CURRENT_PROJECT_VERSION: $(EXTENSION_PROJECT_VERSION)
    entitlements:
      path: RCamExtension/RCamExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Required by the CMIO category validator: CMIOExtensionMachServiceName
        # must descend from an app group in the extension's entitlements
        # (verified against sysextd log + OBS's shipping extension).
        com.apple.security.application-groups:
          - TK7EDP5B95.com.strawdynamics.rcam
    info:
      path: RCamExtension/Info.plist
      properties:
        CFBundlePackageType: SYSX
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleName: RCam
        # App Store Connect rejects a system extension without this key
        # (error 90940), even though CFBundleName is already set.
        CFBundleDisplayName: RCam
        NSSystemExtensionUsageDescription: RCam provides a virtual camera device.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)

  rcamcli:
    type: tool
    platform: macOS
    sources:
      - rcamcli
      - path: RCamKit
        excludes: ["CFFmpeg/**"]
    settings:
      groups: [ffmpeg]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strawdynamics.rcam.cli
        # A bare tool has no bundle to embed FFmpeg in, so it reads the dylibs
        # straight out of the vendor directory. Dev-only, and never shipped.
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/vendor/ffmpeg/lib"
        # Embed an Info.plist section so TCC can attribute the camera-access
        # request to this binary (required for probe-device).
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_NSCameraUsageDescription: rcamcli captures frames from the RCam virtual camera for testing.

  RCamTests:
    type: bundle.unit-test
    platform: macOS
    # Deliberately narrow: only the Foundation-only pure files. No FFmpeg
    # settingGroup, no header search paths, no test host — so the tests build
    # and run without libav and without launching the app.
    sources:
      - RCamTests
      - RCamKit/H264Bitstream.swift
      - RCamKit/StreamHealth.swift
      - RCam/CameraPresets.swift
      - RCam/Watermark.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strawdynamics.rcam.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RCam:
    build:
      targets:
        RCam: all
        RCamTests: [test]
    test:
      targets:
        - RCamTests
  rcamcli:
    build:
      targets:
        rcamcli: all
