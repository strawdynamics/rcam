# Signed, notarized release on a v* tag: build with scripts/release.sh, publish
# the GitHub release, then put the new item into the appcast on the Pages site.
#
# The job runs in the `release` environment, which holds every signing secret
# and only accepts v* tags; the owner approves each run there before any step
# (and so any secret) runs. Tag creation is limited to admins by a ruleset, so
# the trigger itself is privileged. Never add a pull_request(_target) trigger.
#
# Order matters for users already running RCam: the release (and so the DMG
# URL the appcast item points at) exists before the appcast that advertises it
# is deployed. Re-running a run whose release step succeeded fails at that step
# by design: a rebuild gets a new epoch stamp and DMG, which would not match
# the assets already uploaded. Delete the release first if a redo is intended.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Same toolchain pins and runner image as ci.yml; see the comments there.
  XCODE_APP: /Applications/Xcode_26.3.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # Apple's "Developer ID Certification Authority" (G2) intermediate. A .p12
  # exported from Keychain Access usually holds only the leaf, and codesign
  # needs the chain to build a valid signature. Importing it grants no trust
  # (it still has to chain to Apple's root); the pin just keeps a swapped file
  # from being imported at all. From apple.com/certificateauthority, valid
  # until 2031-09-17.
  DEVELOPER_ID_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
  DEVELOPER_ID_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
  APPCAST_URL: https://rcam.strawdynamics.com/appcast.xml

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write      # gh release create
      id-token: write      # attestation signing, and Pages' OIDC check
      attestations: write  # attest-build-provenance
      pages: write         # deploy-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Cheap checks before an hour of building. release.sh repeats the tag
      # check against project.yml; this one only has to catch a re-run.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Delete it before re-running: a rebuild would not match its assets."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # The shipped dylibs are built here from the pinned tarball, never taken
      # from the committed vendor/ (which any PR could have changed). Removing
      # them first means a cache restore or a fresh build is the only way back.
      #
      # Caches are scoped to the ref that saved them, and every release is a new
      # tag, so in practice this hits only on a re-run of the same tag (e.g.
      # after a notarization hiccup). The Xcode path is in the key because the
      # compiler is part of what gets cached.
      - name: Remove the committed FFmpeg build
        run: rm -rf vendor/ffmpeg/lib vendor/ffmpeg/include

      - name: Restore the FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/ffmpeg/lib
            vendor/ffmpeg/include
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_APP }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      # A throwaway keychain holding only the Developer ID identity, on the
      # search list so codesign and xcodebuild find it. Its password is random
      # per run and never leaves this step: the keychain stays unlocked for the
      # job, and deleting it later needs no password.
      - name: Install the signing identity and profiles
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_EXTENSION_BASE64: ${{ secrets.PROFILE_EXTENSION_BASE64 }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD PROFILE_APP_BASE64 PROFILE_EXTENSION_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is empty. Add it to the release environment."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          # Lock after 6h of inactivity rather than the 5 min default, which a
          # long archive plus notarization can outlast.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$DEVELOPER_ID_CA_URL"
          echo "$DEVELOPER_ID_CA_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"

          # Without this, the first codesign blocks on a UI prompt nobody can
          # answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Prepend, keeping login (and anything else) so system tools still work.
          existing=()
          while IFS= read -r k; do
            k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
            [[ -n "$k" ]] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

          # release.sh validates these and installs them where Xcode looks.
          printf '%s' "$PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          printf '%s' "$PROFILE_EXTENSION_BASE64" | base64 --decode > "$RUNNER_TEMP/extension.provisionprofile"
          {
            echo "RELEASE_KEYCHAIN=$keychain"
            echo "RCAM_APP_PROVISIONING_PROFILE=$RUNNER_TEMP/app.provisionprofile"
            echo "RCAM_EXTENSION_PROVISIONING_PROFILE=$RUNNER_TEMP/extension.provisionprofile"
          } >> "$GITHUB_ENV"

      # Only the path goes into the job environment; the key ID and issuer are
      # passed straight to the release step that needs them.
      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_API_KEY_P8_BASE64" ]]; then
            echo "::error::Secret ASC_API_KEY_P8_BASE64 is empty. Add it to the release environment."
            exit 1
          fi
          key="$RUNNER_TEMP/asc-api-key.p8"
          (umask 077 && printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key")
          echo "ASC_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, notarize and sign the release
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # An empty secret would make release.sh fall back to the keychain,
          # which a runner doesn't have; say what's actually missing instead.
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is empty. Add it to the release environment."
              exit 1
            fi
          done
          RELEASE_TAG="$GITHUB_REF_NAME" scripts/release.sh

      # Repo must be public (or on Enterprise Cloud) for attestations.
      - name: Attest the DMG
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/RCam-${{ env.VERSION }}.dmg

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "RCam $VERSION" --notes-file build/release/notes.md \
            "build/release/RCam-$VERSION.dmg" \
            "build/release/RCam-$VERSION-dSYMs.zip" \
            build/release/SHA256SUMS

      # The live feed is the source of truth for past items, not site/: site/'s
      # copy is only the empty seed. A 404 means nothing has been deployed yet,
      # so start from the seed. Anything else fails the job rather than
      # publishing a feed that has silently lost every earlier release. The
      # query string sidesteps Pages' CDN cache.
      - name: Merge the appcast
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-appcast.xml"
          status="$(curl -sS -L -o "$live" -w '%{http_code}' "$APPCAST_URL?run=$GITHUB_RUN_ID")"
          case "$status" in
            200) base="$live" ;;
            404) echo "No live appcast yet; starting from site/appcast.xml"; base=site/appcast.xml ;;
            *) echo "::error::Fetching $APPCAST_URL returned HTTP $status"; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/pages"
          cp -R site "$RUNNER_TEMP/pages"
          scripts/appcast-merge.sh "$base" build/release/appcast-item.xml > "$RUNNER_TEMP/pages/appcast.xml"
          grep -c '<item>' "$RUNNER_TEMP/pages/appcast.xml" | xargs echo "Appcast items:"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      # deploy-pages targets this job's environment, `release`, rather than
      # `github-pages`; its protection rules then apply instead.
      - name: Deploy the Pages site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          # release.sh installs each profile by UUID; remove those copies too.
          for profile in "$RUNNER_TEMP/app.provisionprofile" "$RUNNER_TEMP/extension.provisionprofile"; do
            [[ -f "$profile" ]] || continue
            uuid="$(security cms -D -i "$profile" 2>/dev/null \
              | plutil -extract UUID raw -o - - 2>/dev/null || true)"
            if [[ -n "$uuid" ]]; then
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.provisionprofile" \
                "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.provisionprofile"
            fi
          done
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/asc-api-key.p8" \
            "$RUNNER_TEMP/app.provisionprofile" "$RUNNER_TEMP/extension.provisionprofile"
