<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RCam — RTSP cameras as a macOS virtual camera</title>
  <meta name="description" content="RCam turns RTSP security and IP camera streams into a macOS virtual camera for Zoom, Meet, FaceTime and more.">
  <link rel="icon" type="image/png" href="icon-1024.png">
  <link rel="apple-touch-icon" href="icon-1024.png">
  <style>
    :root {
      --bg: #f5f6f8;
      --fg: #1c1e24;
      --muted: #5b6070;
      --card: #ffffff;
      --border: #dfe2e8;
      --accent: #2f6fe4;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171f;
        --fg: #eceef3;
        --muted: #9aa1b2;
        --card: #1d212c;
        --border: #2c3240;
        --accent: #4d8bff;
        --accent-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
      text-align: center;
    }
    .icon {
      width: 9rem;
      height: 9rem;
      /* The source PNG is full-bleed; round it like a macOS app icon. */
      border-radius: 22.5%;
      box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 0.25);
    }
    h1 {
      margin: 1.5rem 0 0.5rem;
      font-size: 2.75rem;
      letter-spacing: -0.02em;
    }
    .tagline {
      margin: 0 auto 2rem;
      max-width: 34rem;
      font-size: 1.2rem;
      color: var(--muted);
    }
    .download {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      border-radius: 0.6rem;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
    }
    .download:hover, .download:focus-visible { filter: brightness(1.1); }
    .requirements {
      margin: 0.75rem 0 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .screenshot {
      /* Placeholder until there's a real screenshot. */
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 3rem 0;
      aspect-ratio: 16 / 10;
      border: 1px dashed var(--border);
      border-radius: 0.75rem;
      background: var(--card);
      color: var(--muted);
      font-size: 0.95rem;
    }
    footer {
      padding: 0 1.5rem 3rem;
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--fg); }
    footer nav { margin-bottom: 0.5rem; }
    footer nav a { margin: 0 0.6rem; }
    @media (max-width: 30rem) {
      main { padding-top: 2.5rem; }
      .icon { width: 7rem; height: 7rem; }
      h1 { font-size: 2.2rem; }
      .tagline { font-size: 1.05rem; }
      .download { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon-1024.png" alt="RCam app icon" width="1024" height="1024">
    <h1>RCam</h1>
    <p class="tagline">RCam turns RTSP security and IP camera streams into a macOS virtual camera for Zoom, Meet, FaceTime and more.</p>
    <a class="download" href="https://github.com/strawdynamics/rcam/releases/latest">Download RCam</a>
    <p class="requirements">Free and open source. Requires a Mac with Apple Silicon and macOS 15 or later.</p>
    <div class="screenshot" role="img" aria-label="Screenshot coming soon">Screenshot coming soon</div>
  </main>
  <footer>
    <nav>
      <a href="https://github.com/strawdynamics/rcam">GitHub</a>
      <a href="https://github.com/strawdynamics/rcam/issues">Issues</a>
    </nav>
    <p>© 2026 Straw Dynamics. MIT License.</p>
  </footer>
</body>
</html>
